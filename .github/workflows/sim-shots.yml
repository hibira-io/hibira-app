# Real iPhone simulator screenshots of the app as it launches: the sign-in
# page in light and dark, a large and a small iPhone, and the offline page.
# It runs on pull requests that touch the iPhone app, and by hand (Actions →
# sim-shots), to check safe areas and the launch on a real web view; the
# pictures are the run's "sim-shots" artifact.
name: sim-shots
on:
  pull_request:
    paths: [".github/workflows/sim-shots.yml", ".github/scripts/sim-shots.sh", "ios/**", "www/**"]
  workflow_dispatch:
    inputs:
      url:
        description: Page the app opens (default is the app's own start page)
        required: false

permissions:
  contents: read

jobs:
  shots:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Build for the simulator
        env:
          PAGE: ${{ inputs.url }}
        run: .github/scripts/sim-shots.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with: { name: sim-shots, path: shots, if-no-files-found: error }
