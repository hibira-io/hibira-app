<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hibira</title>
<style>
  :root { color-scheme: light dark; --bg: #fbfaf8; --fg: #111110; --muted: #63635e; --brand: #e5484d; }
  @media (prefers-color-scheme: dark) { :root { --bg: #111110; --fg: #f4f3f1; --muted: #a3a39b; --brand: #ff6369; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, system-ui, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
  main { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 22rem; }
  img { width: 96px; height: 96px; border-radius: 22px; }
  h1 { margin: 0; font-size: 26px; letter-spacing: -0.02em; }
  p { margin: 0; color: var(--muted); }
  button { min-height: 44px; padding: 10px 24px; border-radius: 999px; border: 0; background: var(--brand); color: #fff; font: inherit; font-weight: 700; }
</style>
</head>
<body>
<main>
  <img src="icon.png" alt="">
  <h1 id="t">You're offline</h1>
  <p id="d">Hibira opens again once you're back online.</p>
  <button id="b" type="button" onclick="location.href='https://hibira.io/portal/dashboard'">Try again</button>
</main>
<script>
  (function () {
    var T = {
      "zh-TW": ["目前離線", "連上網路後 Hibira 會再次開啟。", "再試一次"],
      "zh-CN": ["当前离线", "恢复网络后 Hibira 会重新打开。", "再试一次"],
      ja: ["オフラインです", "接続が戻ると Hibira が開きます。", "もう一度試す"],
      ko: ["오프라인 상태예요", "다시 연결되면 Hibira가 열려요.", "다시 시도"],
      th: ["ออฟไลน์อยู่", "Hibira จะเปิดอีกครั้งเมื่อกลับมาออนไลน์", "ลองอีกครั้ง"],
      vi: ["Bạn đang ngoại tuyến", "Hibira sẽ mở lại khi bạn có mạng.", "Thử lại"]
    };
    var l = (navigator.language || "en").toLowerCase();
    var k = l.indexOf("zh") === 0 ? (/hant|tw|hk|mo/.test(l) ? "zh-TW" : "zh-CN") : l.slice(0, 2);
    var w = T[k];
    if (!w) return;
    document.documentElement.lang = k;
    document.getElementById("t").textContent = w[0];
    document.getElementById("d").textContent = w[1];
    document.getElementById("b").textContent = w[2];
  })();
</script>
</body>
</html>
